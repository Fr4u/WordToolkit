services:
  - type: web
    name: wordtoolkit-mcp
    runtime: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    disk:
      name: wordtoolkit-ephemeral
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: WORDTOOLKIT_ENVIRONMENT
        value: production
      - key: WORDTOOLKIT_BIND_HOST
        value: 0.0.0.0
      - key: WORDTOOLKIT_PUBLIC_BASE_URL
        sync: false
      - key: WORDTOOLKIT_AUTH_MODE
        value: oauth_jwt
      - key: WORDTOOLKIT_OAUTH_ISSUER
        sync: false
      - key: WORDTOOLKIT_OAUTH_AUDIENCE
        sync: false
      - key: WORDTOOLKIT_OAUTH_JWKS_URL
        sync: false
      - key: WORDTOOLKIT_SIGNING_SECRET
        sync: false
      - key: WORDTOOLKIT_STORAGE_ROOT
        value: /data/sessions
      - key: WORDTOOLKIT_ALLOWED_UPLOAD_HOST_SUFFIXES
        value: .oaiusercontent.com,.blob.core.windows.net,.amazonaws.com

