dependencies = [
    { name = "cryptography" },
    { name = "httpx" },
    { name = "latex2mathml" },
    { name = "lxml" },
    { name = "mcp" },
    { name = "mistune" },
    { name = "pillow" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyjwt", extra = ["crypto"] },
    { name = "pypdf" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
    { name = "regex" },
    { name = "starlette" },
    { name = "uvicorn", extra = ["standard"] },
]

