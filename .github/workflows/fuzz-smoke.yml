name: bounded fuzz smoke

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-fuzz-smoke
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: bounded OPC mutation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"

      - name: Restore engine test project
        run: dotnet restore native/WordToolkit.Engine.Tests/WordToolkit.Engine.Tests.csproj

      - name: Run bounded OPC mutation tests
        run: >-
          dotnet test native/WordToolkit.Engine.Tests/WordToolkit.Engine.Tests.csproj
          --configuration Release
          --no-restore
          --filter
          "FullyQualifiedName~OpcFuzzSmokeTests|FullyQualifiedName~OpcStructuredMutationTests"
          --results-directory TestResults
          --logger "trx;LogFileName=bounded-fuzz-smoke.trx"

      - name: Upload fuzz-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-fuzz-smoke-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 7
