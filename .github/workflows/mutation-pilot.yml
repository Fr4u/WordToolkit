name: mutation-pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-python-security:
    name: legacy Python security mutation pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.11.23"
          python-version: "3.12"
      - run: uv sync --extra dev --extra mutation --locked
      - name: Run the bounded security-module pilot
        run: uv run mutmut run
      - name: Print surviving and killed mutants
        if: ${{ always() }}
        run: uv run mutmut results --all=true
